name: Release plug-in installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plug-ins and MSI installers
        shell: pwsh
        run: >-
          ./scripts/build-release.ps1
          -Version "${{ github.ref_name }}"
          -RevitVersions 2019,2020,2021,2022,2023,2024

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem -LiteralPath ./release -File |
            Where-Object { $_.Extension -eq ".msi" -or $_.Name -eq "SHA256SUMS.txt" } |
            ForEach-Object { $_.FullName }

          if ($assets.Count -ne 8) {
            throw "Expected six Revit MSI files, one AutoCAD MSI, and SHA256SUMS.txt, found $($assets.Count) release assets."
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          }
          else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title $env:RELEASE_TAG
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publishing failed."
          }
